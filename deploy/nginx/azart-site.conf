# Nginx: обратный прокси перед Next.js (PM2 → 127.0.0.1:3000).
# Установка на сервере:
#   sudo cp deploy/nginx/azart-site.conf /etc/nginx/sites-available/azart-site
#   sudo ln -s /etc/nginx/sites-available/azart-site /etc/nginx/sites-enabled/
# Замените example.ru на свой домен. HTTPS потом добавит certbot (--nginx).

upstream azart_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;

    # формы на сайте внешние (Яндекс Формы), большие тела запросов не нужны
    client_max_body_size 2m;

    # базовые заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip для текстовых ответов (Next тоже сжимает, но так nginx не гоняет лишнее)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # хешированные ассеты сборки отдаём прямо с диска — без похода в Node
    location /_next/static/ {
        alias /var/www/azart-site/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # всё остальное — в Next.js
    location / {
        proxy_pass http://azart_next;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
    }
}
